<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Saurabh Pathak, AI Engineer and Full-Stack Developer</title>
  <desc id="d">Banner with name, role and an animated trace of an AI agent calling tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0c1a22"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2dd4bf" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="915" cy="170" r="260" fill="url(#glow)"/>

  <!-- left: identity -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="70" y="104" font-size="18" font-weight="600" fill="#2dd4bf">AI Engineer and full-stack developer
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
    </text>
    <text x="68" y="172" font-size="64" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">Saurabh Pathak
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.15s" fill="freeze"/>
    </text>
    <rect x="72" y="194" width="140" height="4" rx="2" fill="url(#rule)">
      <animate attributeName="width" from="0" to="140" dur="0.9s" begin="0.4s" fill="freeze"/>
    </rect>
    <text font-size="20" fill="#9da7b3">
      <tspan x="70" y="240">I build AI agents, MCP servers and RAG pipelines,</tspan>
      <tspan x="70" y="268">and ship them as production web apps.</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
    </text>
  </g>

  <!-- right: agent trace panel -->
  <g transform="translate(690 62)">
    <rect width="450" height="220" rx="12" fill="#0b131b" stroke="#30363d"/>
    <rect width="450" height="36" rx="12" fill="#111b24"/>
    <rect y="24" width="450" height="12" fill="#111b24"/>
    <line x1="0" y1="36" x2="450" y2="36" stroke="#30363d"/>
    <circle cx="20" cy="18" r="5" fill="#2dd4bf" fill-opacity="0.8"/>
    <text x="34" y="23" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b949e">agent trace</text>

    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="14.5" xml:space="preserve">
      <text x="20" y="72" fill="#e6edf3">$ agent.run("triage new issues")
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="20" y="104" fill="#8b949e">  tool  <tspan fill="#2dd4bf">github.list_issues</tspan><tspan x="350">12 found</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.18;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="20" y="132" fill="#8b949e">  tool  <tspan fill="#2dd4bf">rag.search_docs</tspan><tspan x="350">top 5</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.32;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="20" y="160" fill="#8b949e">  tool  <tspan fill="#2dd4bf">notes.create</tspan><tspan x="350">saved</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="20" y="196" fill="#fbbf24">✓ done in 2.1s, 3 tool calls <tspan>▍<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.62;0.92;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
