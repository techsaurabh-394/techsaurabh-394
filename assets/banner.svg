<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Saurabh Pathak, AI Engineer. Agents, MCP servers and RAG with evals. An animated cartoon robot agent waves, blinks and announces plan, human approval and eval score.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFF"/><stop offset="1" stop-color="#E0E7FF"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#A5B4FC" opacity=".55"/></pattern>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4F46E5" flood-opacity=".18"/></filter>
</defs>
<rect width="1200" height="360" rx="20" fill="url(#bg)"/>
<rect width="1200" height="360" rx="20" fill="url(#dots)"/>
<circle cx="130" cy="-10" r="170" fill="#818CF8" opacity=".14"/>
<circle cx="1160" cy="380" r="200" fill="#38BDF8" opacity=".16"/>

<rect x="56" y="48" width="196" height="30" rx="15" fill="#fff" stroke="#C7D2FE"/>
<circle cx="76" cy="63" r="5" fill="#22C55E"><animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.45;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="90" y="68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#334155">agent online · building</text>

<text x="56" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="56" font-weight="800" fill="url(#nm)" letter-spacing="-1.5">Saurabh Pathak</text>
<text x="56" y="192" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#1E293B">AI Engineer · Full-Stack Developer</text>
<text x="56" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#475569">I build agents that act on real systems:</text>
<text x="56" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#475569">MCP servers, RAG measured with evals, human-gated tools.</text>
<rect x="56" y="278" width="53" height="30" rx="15" fill="#fff" stroke="#C7D2FE"/><text x="82.5" y="298" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4338CA">MCP</text><rect x="119" y="278" width="53" height="30" rx="15" fill="#fff" stroke="#C7D2FE"/><text x="145.5" y="298" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4338CA">RAG</text><rect x="182" y="278" width="71" height="30" rx="15" fill="#fff" stroke="#C7D2FE"/><text x="217.5" y="298" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4338CA">Evals</text><rect x="263" y="278" width="116" height="30" rx="15" fill="#fff" stroke="#C7D2FE"/><text x="321.0" y="298" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4338CA">TypeScript</text><rect x="389" y="278" width="80" height="30" rx="15" fill="#fff" stroke="#C7D2FE"/><text x="429.0" y="298" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4338CA">Python</text><rect x="479" y="278" width="89" height="30" rx="15" fill="#fff" stroke="#C7D2FE"/><text x="523.5" y="298" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4338CA">FastAPI</text>


<ellipse cx="860" cy="330" rx="86" ry="10" fill="#4F46E5" opacity=".16"><animate attributeName="rx" values="86;70;86" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".16;.1;.16" dur="3s" repeatCount="indefinite"/></ellipse>
<g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3s" repeatCount="indefinite"/>
<!-- antenna -->
<line x1="860" y1="62" x2="860" y2="86" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
<circle cx="860" cy="56" r="8" fill="#F43F5E"><animate attributeName="r" values="7;10;7" dur="1.6s" repeatCount="indefinite"/><animate attributeName="fill" values="#F43F5E;#FBBF24;#F43F5E" dur="3.2s" repeatCount="indefinite"/></circle>
<!-- ears -->
<rect x="764" y="116" width="16" height="40" rx="8" fill="#A5B4FC"/><rect x="940" y="116" width="16" height="40" rx="8" fill="#A5B4FC"/>
<!-- head -->
<rect x="776" y="84" width="168" height="124" rx="38" fill="#fff" stroke="#6366F1" stroke-width="4"/>
<rect x="794" y="102" width="132" height="88" rx="26" fill="#1E1B4B"/>
<!-- eyes -->
<g><ellipse cx="832" cy="138" rx="12" ry="15" fill="#67E8F9"><animate attributeName="ry" values="15;15;1.5;15;15" keyTimes="0;.42;.45;.48;1" dur="4s" repeatCount="indefinite"/></ellipse>
<ellipse cx="888" cy="138" rx="12" ry="15" fill="#67E8F9"><animate attributeName="ry" values="15;15;1.5;15;15" keyTimes="0;.42;.45;.48;1" dur="4s" repeatCount="indefinite"/></ellipse>
<circle cx="836" cy="133" r="4" fill="#fff" opacity=".9"/><circle cx="892" cy="133" r="4" fill="#fff" opacity=".9"/></g>
<path d="M838 165q22 18 44 0" fill="none" stroke="#67E8F9" stroke-width="5" stroke-linecap="round"/>
<circle cx="812" cy="166" r="7" fill="#F472B6" opacity=".55"/><circle cx="908" cy="166" r="7" fill="#F472B6" opacity=".55"/>
<!-- neck + body -->
<rect x="846" y="206" width="28" height="14" rx="4" fill="#A5B4FC"/>
<rect x="798" y="218" width="124" height="96" rx="30" fill="#EEF2FF" stroke="#6366F1" stroke-width="4"/>
<rect x="824" y="238" width="72" height="44" rx="12" fill="#fff" stroke="#C7D2FE" stroke-width="2"/>
<path d="M836 262h12l6-12 8 22 6-10h12" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="stroke" values="#4F46E5;#0EA5E9;#4F46E5" dur="2.4s" repeatCount="indefinite"/></path>
<circle cx="836" cy="298" r="4" fill="#22C55E"/><circle cx="852" cy="298" r="4" fill="#FBBF24"/><circle cx="868" cy="298" r="4" fill="#F43F5E"/>
<!-- left arm -->
<rect x="768" y="232" width="28" height="64" rx="14" fill="#C7D2FE" stroke="#6366F1" stroke-width="3"/>
<!-- waving right arm -->
<g><animateTransform attributeName="transform" type="rotate" values="0 928 240;-34 928 240;0 928 240;-34 928 240;0 928 240" keyTimes="0;.15;.3;.45;1" dur="5s" repeatCount="indefinite"/>
<rect x="916" y="176" width="28" height="70" rx="14" fill="#C7D2FE" stroke="#6366F1" stroke-width="3" transform="rotate(25 930 240)"/>
<circle cx="954" cy="182" r="14" fill="#fff" stroke="#6366F1" stroke-width="3"/></g>
</g>
<!-- speech bubble -->
<g><rect x="940" y="52" width="220" height="48" rx="16" fill="#fff" stroke="#C7D2FE" stroke-width="2"/><path d="M968 100l-14 16 28-12z" fill="#fff" stroke="#C7D2FE" stroke-width="2"/><rect x="960" y="99" width="30" height="4" fill="#fff"/></g>
<text x="1050" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#312E81" opacity="0">Plan → call tool → verify<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.019;0.250;0.269;1" dur="16s" repeatCount="indefinite"/></text><text x="1050" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#312E81" opacity="0">⚠ Needs human approval<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.269;0.500;0.519;1" dur="16s" repeatCount="indefinite"/></text><text x="1050" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#312E81" opacity="0">✓ Approved, running…<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.519;0.750;0.769;1" dur="16s" repeatCount="indefinite"/></text><text x="1050" y="82" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#312E81" opacity="0">Eval score 0.92 🎯<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.769;1.000;1.019;1" dur="16s" repeatCount="indefinite"/></text>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.4s" begin="0s" repeatCount="indefinite"/><rect x="664" y="120" width="67" height="30" rx="15" fill="#fff" stroke="#7C3AED" stroke-opacity=".55"/><circle cx="679" cy="135" r="4.5" fill="#7C3AED"/><text x="690" y="140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E293B">MCP</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.4s" begin="0.8s" repeatCount="indefinite"/><rect x="676" y="206" width="67" height="30" rx="15" fill="#fff" stroke="#0EA5E9" stroke-opacity=".55"/><circle cx="691" cy="221" r="4.5" fill="#0EA5E9"/><text x="702" y="226" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E293B">RAG</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.4s" begin="1.5s" repeatCount="indefinite"/><rect x="980" y="226" width="85" height="30" rx="15" fill="#fff" stroke="#16A34A" stroke-opacity=".55"/><circle cx="995" cy="241" r="4.5" fill="#16A34A"/><text x="1006" y="246" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E293B">Evals</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.4s" begin="2.2s" repeatCount="indefinite"/><rect x="1000" y="290" width="85" height="30" rx="15" fill="#fff" stroke="#F59E0B" stroke-opacity=".55"/><circle cx="1015" cy="305" r="4.5" fill="#F59E0B"/><text x="1026" y="310" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E293B">Tools</text></g>
</svg>