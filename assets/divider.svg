<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="">
<defs>
  <filter id="d-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="d-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="d-soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
  <linearGradient id="d-glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.085"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
  </linearGradient>
  <linearGradient id="d-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.36"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#67E8F9" stop-opacity="0.22"/>
  </linearGradient>
  <linearGradient id="d-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <pattern id="d-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.055"/>
  </pattern>
    <linearGradient id="d-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient></defs>
  <rect x="0" y="17.5" width="1200" height="1" fill="url(#d-line)"/>
  <ellipse cy="18" rx="60" ry="3" fill="#67E8F9" filter="url(#d-glow)" opacity="0.9">
    <animate attributeName="cx" values="-80;1280" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 0.4 1"/>
  </ellipse>
  <circle cy="18" r="2.5" fill="#FFFFFF">
    <animate attributeName="cx" values="-20;1340" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 0.4 1"/>
  </circle>
</svg>
