<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" width="1120" height="220" role="img" aria-label="Agent loop: you ask, the agent plans, calls MCP tools, a human approves risky actions, and eval scores feed back into the agent.">
