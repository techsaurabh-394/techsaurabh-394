<text x="560.0" y="191" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#4338CA">evals score every run, then improve prompts and tools</text>
