inkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F172A">MCP tools</text><text x="496" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#64748B">typed calls</text><animate attributeName="opacity" values="1;1;.55;1" keyTimes="0;0.36;0.45;1" dur="6s" repeatCount="indefinite"/></g><path d="M654 98.0 H686" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1s" repeatCount="indefinite"/></path><path d="M680 93.0 l7 5 l-7 5" fill="none" stroke="#94A3B8" stroke-width="2"/><g><rect x="692" y="56" width="176" height="84" rx="14" fill="#fff" stroke="#F59E0B" stroke-opacity=".5" stroke-width="1.5"/><rect x="692" y="56" width="6" height="84" rx="3" fill="#F59E0B"/><text x="716" y="92" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F172A">Human gate</text><text x="716" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#64748B">approves risky</text><animate attributeName="opacity" values="1;1;.55;1" keyTimes="0;0.54;0.63;1" dur="6s" repeatCount="indefinite"/></g><path d="M874 98.0 H906" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1s" repeatCount="indefinite"/></path><path d="M900 93.0 l7 5 l-7 5" fill="none" stroke="#94A3B8" stroke-width="2"/><g><rect x="912" y="56" width="176" height="84" rx="14" fill="#fff" stroke="#16A34A" stroke-opacity=".5" stroke-width="1.5"/><rect x="912" y="56" width="6" height="84" rx="3" fill="#16A34A"/><text x="936" y="92" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F172A">Result</text><text x="936" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#64748B">verified</text><animate attributeName="opacity" values="1;1;.55;1" keyTimes="0;0.72;0.81;1" dur="6s" repeatCount="indefinite"/></g>
<path d="M1000.0 144 V186 H340.0 V144" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/></path>
