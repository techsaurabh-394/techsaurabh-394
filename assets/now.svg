<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Currently: building MCP servers with approval-gated actions, learning agent evals, reading the MCP spec.">
<title>Currently: building MCP servers with approval-gated actions, learning agent evals, reading the MCP spec.</title>
<defs>
  <filter id="n-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="n-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="n-soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
  <linearGradient id="n-glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.085"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
  </linearGradient>
  <linearGradient id="n-edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.36"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#67E8F9" stop-opacity="0.22"/>
  </linearGradient>
  <linearGradient id="n-beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <pattern id="n-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.055"/>
  </pattern></defs>
  <clipPath id="n-clip"><rect width="600" height="250" rx="22"/></clipPath>
  <g clip-path="url(#n-clip)">
    <rect width="600" height="250" fill="#050816"/>
    
  <circle cx="520" cy="20" r="130" fill="#67E8F9" opacity="0.22" filter="url(#n-blur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-20 20;0 0" dur="18s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
  <circle cx="60" cy="260" r="140" fill="#A78BFA" opacity="0.22" filter="url(#n-blur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;20 -20;0 0" dur="22s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
    <rect width="600" height="250" fill="url(#n-dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="249" rx="22" fill="none" stroke="url(#n-edge)"/>
  <text x="32" y="44" font-family="'Segoe UI Variable Display','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EAF7">Currently</text>
  <text x="568" y="44" text-anchor="end" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" font-size="12" fill="#4A5280">updated by hand</text>
  <line x1="32" y1="58" x2="568" y2="58" stroke="#FFFFFF" stroke-opacity="0.08"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
      <circle cx="40" cy="79" r="4" fill="#67E8F9" filter="url(#n-glow)"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="56" y="84" font-family="'Segoe UI Variable Display','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#67E8F9">BUILDING</text>
      <text x="56" y="105" font-family="'Segoe UI Variable Display','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#E6EAF7">MCP servers with safe, approval-gated tool actions</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.6s" fill="freeze"/>
      <circle cx="40" cy="131" r="4" fill="#A78BFA" filter="url(#n-glow)"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="56" y="136" font-family="'Segoe UI Variable Display','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#A78BFA">LEARNING</text>
      <text x="56" y="157" font-family="'Segoe UI Variable Display','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#E6EAF7">agent evals and reliable tool use in RAG pipelines</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.6s" fill="freeze"/>
      <circle cx="40" cy="183" r="4" fill="#F472B6" filter="url(#n-glow)"><animate attributeName="opacity" values="1;0.35;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <text x="56" y="188" font-family="'Segoe UI Variable Display','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#F472B6">READING</text>
      <text x="56" y="209" font-family="'Segoe UI Variable Display','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#E6EAF7">the Model Context Protocol spec and open-source agent code</text></g>
</svg>
