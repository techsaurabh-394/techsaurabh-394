name: Profile refresh

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build animated hero, divider and architecture
        run: |
          node scripts/build-static.mjs
          node scripts/build-extra.mjs

      - name: Refresh stats, languages, project cards, OSS table and blog posts
        run: node scripts/update-profile.mjs
        env:
          # Optional: add a classic PAT (read:user, repo) as PROFILE_TOKEN to include private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: refresh profile"
            git pull --rebase
            git push
          fi

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#67E8F9&color_dots=#1A2150,#2D4A9E,#3FA9E0,#67E8F9,#B8F4FF

      - name: Publish snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
