name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# contents: write is the minimum needed to push the "output" branch.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install generate-snake-animation (pinned, no install scripts)
        run: |
          mkdir -p "$RUNNER_TEMP/snk" && cd "$RUNNER_TEMP/snk"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact generate-snake-animation@3.5.0
          cp "$GITHUB_WORKSPACE/scripts/generate_snake.mjs" .

      - name: Build arcade snake
        working-directory: ${{ runner.temp }}/snk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAKE_USER: ${{ github.repository_owner }}
          SNAKE_OUT: ${{ github.workspace }}/dist
        run: node generate_snake.mjs

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
