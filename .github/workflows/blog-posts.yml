name: Update latest blog posts

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh README from blog feed
        env:
          # Set repo variable BLOG_FEED_URL (Settings > Secrets and variables > Actions > Variables)
          BLOG_FEED_URL: ${{ vars.BLOG_FEED_URL || 'https://mernstackdev.com/feed' }}
        run: python scripts/update_blog_posts.py README.md 5
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "Saurabh Pathak"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update latest blog posts"
            git push
          fi
